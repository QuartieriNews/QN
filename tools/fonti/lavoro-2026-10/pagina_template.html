<title>Eventi dei quartieri QN</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral+SC:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: colonna dei Municipi a sinistra, home del quartiere a destra; in testa a ogni quartiere una targa di marmo come le targhe stradali romane. */
:root{
  --bg:#f3f4f2; --panel:#ffffff; --ink:#1d2321; --muted:#5d6763; --line:#d9ddd9;
  --marble:#fbfbf8; --marble-edge:#c9ccc6; --accent:#1f5e57; --accent-soft:#e2eeeb;
  --z0:#b8432f; --z1:#c98a1c; --z5:#6a8f3a; --z10:#1f5e57; --warn-bg:#fbefe3; --warn-ink:#8a4a12;
  --f-plate:"Spectral SC",Georgia,"Times New Roman",serif; --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-data:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141816;--panel:#1b201e;--ink:#e6eae7;--muted:#9aa49f;--line:#2e3532;--marble:#22282a;--marble-edge:#3a4245;--accent:#6cc2b4;--accent-soft:#1d3532;--z0:#e07a63;--z1:#e2b056;--z5:#9cc26a;--z10:#6cc2b4;--warn-bg:#3a2a18;--warn-ink:#f0c08a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141816;--panel:#1b201e;--ink:#e6eae7;--muted:#9aa49f;--line:#2e3532;--marble:#22282a;--marble-edge:#3a4245;--accent:#6cc2b4;--accent-soft:#1d3532;--z0:#e07a63;--z1:#e2b056;--z5:#9cc26a;--z10:#6cc2b4;--warn-bg:#3a2a18;--warn-ink:#f0c08a;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);gap:28px;max-width:1240px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 20px;border-bottom:1px solid var(--line);padding-bottom:12px}
header.top h1{font-family:var(--f-plate);font-weight:600;font-size:1.55rem;letter-spacing:.04em;margin:0}
header.top p{margin:0;color:var(--muted);font-size:.86rem}
nav.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);align-self:start;max-height:calc(100vh - 40px);overflow:auto;display:flex;flex-direction:column;gap:14px;padding-right:4px}
.rail button,.chip{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
.rail .all{font-weight:600;padding:6px 8px;border-radius:6px}
.rail .all[aria-current="true"],.qn[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.mun h3{margin:0 0 4px;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mun ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.qn{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;padding:4px 8px;border-radius:6px;font-size:.9rem}
.qn:hover,.rail .all:hover{background:var(--accent-soft)}
.qn:focus-visible,.rail .all:focus-visible,.tile:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.n{font-family:var(--f-data);font-size:.78rem;font-variant-numeric:tabular-nums;min-width:2.2em;text-align:right;padding:1px 6px;border-radius:999px;color:#fff}
.f0{background:var(--z0)} .f1{background:var(--z1)} .f5{background:var(--z5)} .f10{background:var(--z10)}
:root .n{color:var(--panel)}
.mobile-pick{display:none}
main{min-width:0}
.plate{background:var(--marble);border:1px solid var(--marble-edge);border-radius:4px;box-shadow:inset 0 0 0 5px var(--marble),inset 0 0 0 6px var(--marble-edge);padding:18px 22px;text-align:center;margin-bottom:18px}
.plate .mun-l{font-family:var(--f-plate);font-size:.95rem;letter-spacing:.18em;color:var(--muted)}
.plate h2{font-family:var(--f-plate);font-weight:600;font-size:clamp(1.6rem,4vw,2.4rem);letter-spacing:.06em;margin:2px 0 0;text-wrap:balance}
.plate .count{margin-top:6px;font-size:.88rem;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.tools input{flex:1 1 220px;min-width:0;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
.tools .legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.8rem;color:var(--muted)}
.tools .legend span{display:inline-flex;align-items:center;gap:5px}
.tools .legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.group h4{font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px;font-weight:600}
.ev{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.date{font-family:var(--f-data);text-align:center;line-height:1.1;padding-top:2px}
.date .d{font-size:1.45rem;font-weight:500}
.date .m{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.date .w{font-size:.7rem;color:var(--muted)}
.body{min-width:0}
.body .t{font-weight:600;font-size:1rem;margin:0 0 3px;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:.86rem}
.meta span{overflow-wrap:anywhere}
.src{display:inline-flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.chip{font-size:.72rem;letter-spacing:.04em;padding:2px 7px;border-radius:4px;border:1px solid var(--line);color:var(--muted);cursor:default}
.chip.rt{background:var(--warn-bg);color:var(--warn-ink);border-color:transparent}
.chip.free{color:var(--accent);border-color:var(--accent)}
a{color:var(--accent)}
.src a{font-size:.84rem}
.empty{padding:28px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);text-align:center}
.grid{display:grid;gap:22px}
.grid .munblock h3{font-family:var(--f-plate);letter-spacing:.14em;font-size:1rem;margin:0 0 8px;color:var(--muted);font-weight:500}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:6px;background:var(--panel);border:1px solid var(--line);cursor:pointer;font:inherit;color:inherit;text-align:left;border-left-width:5px}
.tile b{font-weight:600;font-size:.92rem}
.tile small{font-family:var(--f-data);font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tile.f0{border-left-color:var(--z0);background:var(--panel)} .tile.f1{border-left-color:var(--z1);background:var(--panel)} .tile.f5{border-left-color:var(--z5);background:var(--panel)} .tile.f10{border-left-color:var(--z10);background:var(--panel)}
.summary{display:flex;flex-wrap:wrap;gap:8px 22px;margin-bottom:16px;font-size:.9rem}
.summary b{font-family:var(--f-data);font-variant-numeric:tabular-nums;font-size:1.1rem}
.note{font-size:.82rem;color:var(--muted);max-width:70ch;margin:0 0 16px}
@media (max-width:820px){.wrap{grid-template-columns:minmax(0,1fr)}nav.rail{display:none}.mobile-pick{display:block;margin-bottom:12px}.mobile-pick select{width:100%;font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}}
@media (prefers-reduced-motion:no-preference){.ev{transition:background .15s}.ev:hover{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}}
</style>
<div class="wrap">
  <header class="top"><h1>Eventi dei quartieri</h1><p id="stamp"></p></header>
  <nav class="rail" id="rail" aria-label="Pagine di quartiere"></nav>
  <main id="main">
    <div class="mobile-pick"><label for="pick" class="note">Pagina di quartiere</label><select id="pick"></select></div>
    <div id="view"></div>
  </main>
</div>
<script id="data" type="application/json">__DATA__</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const ROM=['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV'];
const MESI=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const MESI_L=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const GG=['dom','lun','mar','mer','gio','ven','sab'];
const today=D.oggi;
const byZ={}; D.eventi.forEach(e=>{const k=e.z||'senza-quartiere';(byZ[k]=byZ[k]||[]).push(e)});
const cnt=z=>(byZ[z]||[]).length;
const fcls=n=>n===0?'f0':n<5?'f1':n<10?'f5':'f10';
const pages=D.pagine; const pById=Object.fromEntries(pages.map(p=>[p.id,p]));
document.getElementById('stamp').textContent=`${D.eventi.length.toLocaleString('it-IT')} eventi futuri noti al ${fmtLong(today)} · ${pages.length} pagine di quartiere`;
function fmtLong(s){const d=new Date(s+'T12:00:00');return `${d.getDate()} ${MESI_L[d.getMonth()]} ${d.getFullYear()}`}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function rail(){
  const r=document.getElementById('rail'); let h=`<button class="all" data-go="tutte">Tutte le pagine</button>`;
  ROM.forEach(m=>{const ps=pages.filter(p=>p.mun===m); if(!ps.length)return;
    h+=`<div class="mun"><h3>Municipio ${m}</h3><ul>`+ps.map(p=>`<li><button class="qn" data-go="${p.id}"><span>${esc(p.nome)}</span><span class="n ${fcls(cnt(p.id))}">${cnt(p.id)}</span></button></li>`).join('')+`</ul></div>`});
  h+=`<div class="mun"><h3>Fuori dalle pagine</h3><ul><li><button class="qn" data-go="senza-quartiere"><span>Senza quartiere</span><span class="n f1">${cnt('senza-quartiere')}</span></button></li></ul></div>`;
  r.innerHTML=h;
  const sel=document.getElementById('pick'); sel.innerHTML=`<option value="tutte">Tutte le pagine</option>`+ROM.map(m=>`<optgroup label="Municipio ${m}">`+pages.filter(p=>p.mun===m).map(p=>`<option value="${p.id}">${esc(p.nome)} (${cnt(p.id)})</option>`).join('')+`</optgroup>`).join('')+`<option value="senza-quartiere">Senza quartiere (${cnt('senza-quartiere')})</option>`;
}
function setCurrent(id){document.querySelectorAll('[data-go]').forEach(b=>b.setAttribute('aria-current',b.dataset.go===id?'true':'false'));const s=document.getElementById('pick');if(s.value!==id)s.value=id}
function overview(){
  const nz=pages.filter(p=>!cnt(p.id)).length, n5=pages.filter(p=>cnt(p.id)>0&&cnt(p.id)<5).length, n9=pages.filter(p=>cnt(p.id)>=5&&cnt(p.id)<10).length, n10=pages.filter(p=>cnt(p.id)>=10).length;
  let h=`<div class="summary"><span><b>${n10}</b> pagine con 10 o più eventi</span><span><b>${n9}</b> fra 5 e 9</span><span><b>${n5}</b> fra 1 e 4</span><span><b>${nz}</b> a zero</span></div>`;
  h+=`<p class="note">Ogni riquadro è la home di una pagina di quartiere; il numero conta gli eventi futuri noti oggi, comprese le mostre in corso. Fonti: culture.roma.it, siti delle fonti, eventi Facebook delle pagine lette, Roma Today (segnato: da cercare alla fonte prima di pubblicare). Gli eventi segnati «da verificare» sono candidati, non schede: blocchi di testo con una data letti sui siti nuovi, oppure appuntamenti estratti dal testo dei post Facebook delle fonti (ultimi post di 3.977 pagine).</p>`;
  h+=`<div class="tools"><div class="legend"><span><i class="f10"></i>10 o più</span><span><i class="f5"></i>5-9</span><span><i class="f1"></i>1-4</span><span><i class="f0"></i>nessuno</span></div></div><div class="grid">`;
  ROM.forEach(m=>{const ps=pages.filter(p=>p.mun===m); if(!ps.length)return; h+=`<section class="munblock"><h3>MUNICIPIO ${m}</h3><div class="tiles">`+ps.map(p=>`<button class="tile ${fcls(cnt(p.id))}" data-go="${p.id}"><b>${esc(p.nome)}</b><small>${cnt(p.id)} eventi</small></button>`).join('')+`</div></section>`});
  return h+`</div>`;
}
function dateTile(e){
  const ongoing=e.d1<today; const s=ongoing?e.d2:e.d1; const d=new Date(s+'T12:00:00');
  return `<div class="date">${ongoing?'<div class="w">fino al</div>':`<div class="w">${GG[d.getDay()]}</div>`}<div class="d">${d.getDate()}</div><div class="m">${MESI[d.getMonth()]}</div></div>`;
}
function when(e){
  const p=[]; if(e.d1<today)p.push(`in corso dal ${fmtLong(e.d1)}`); else if(e.d2&&e.d2!==e.d1)p.push(`fino al ${fmtLong(e.d2)}`);
  if(e.ric)p.push(`ogni ${esc(({lunedi:'lunedì',martedi:'martedì',mercoledi:'mercoledì',giovedi:'giovedì',venerdi:'venerdì',sabato:'sabato',domenica:'domenica'})[e.ric]||e.ric)}`); if(e.ora)p.push(`ore ${esc(e.ora)}`); return p;
}
function evRow(e){
  const meta=[...when(e)]; if(e.luogo)meta.push(esc(e.luogo)); if(e.ind&&e.ind!==e.luogo)meta.push(esc(e.ind));
  const src=e.src==='Facebook (post)'?`<span class="chip">Facebook, post</span>`:e.src==='Roma Today'?`<span class="chip rt">solo Roma Today: cercare la fonte</span>`:`<span class="chip">${esc(e.src)}</span>`;
  return `<article class="ev">${dateTile(e)}<div class="body"><p class="t">${esc(e.t)}</p><div class="meta">${meta.map(x=>`<span>${x}</span>`).join('')}</div><div class="src">${src}${e.free?'<span class="chip free">gratuito</span>':''}${e.dv?'<span class="chip rt">da verificare: testo con data</span>':''}${e.dp?'<span class="chip rt">da un post: da verificare</span>':''}${e.org?`<span class="meta">a cura di ${esc(e.org)}</span>`:''}${e.url?`<a href="${esc(e.url)}" target="_blank" rel="noopener">fonte</a>`:''}</div></div></article>`;
}
function home(id,q){
  const p=pById[id]; const evs=(byZ[id]||[]).filter(e=>!q||(e.t+' '+(e.luogo||'')+' '+(e.org||'')).toLowerCase().includes(q.toLowerCase()));
  let h=`<div class="plate"><div class="mun-l">${p?`MUNICIPIO ${p.mun}`:'ROMA'}</div><h2>${esc(p?p.nome:'Senza quartiere')}</h2><div class="count">${cnt(id)} eventi futuri noti${p?'':' · fuori Roma, online o senza luogo leggibile'}</div></div>`;
  h+=`<div class="tools"><label for="q" class="note" hidden>Filtra</label><input id="q" type="search" aria-label="Filtra gli eventi" placeholder="Filtra per titolo, luogo, organizzatore" value="${esc(q||'')}"></div>`;
  if(!evs.length) return h+`<div class="empty">${cnt(id)?'Nessun evento corrisponde al filtro.':'Nessun evento futuro noto per questa pagina: è una delle pagine da coprire con le fonti mirate.'}</div>`;
  const groups=[]; const on=evs.filter(e=>e.d1<today); if(on.length)groups.push(['In corso',on]);
  const up=evs.filter(e=>e.d1>=today); const bym={}; up.forEach(e=>{const k=e.d1.slice(0,7);(bym[k]=bym[k]||[]).push(e)});
  Object.keys(bym).sort().forEach(k=>{const [y,m]=k.split('-');groups.push([`${MESI_L[+m-1]} ${y}`,bym[k]])});
  return h+groups.map(([t,es])=>`<section class="group"><h4>${t} · ${es.length}</h4>${es.map(evRow).join('')}</section>`).join('');
}
let cur='tutte';
function go(id,keepQ){
  cur=(id&&(pById[id]||id==='senza-quartiere'))?id:'tutte';
  const v=document.getElementById('view'); const q=keepQ?(document.getElementById('q')||{}).value:'';
  v.innerHTML=cur==='tutte'?overview():home(cur,q); setCurrent(cur);
  try{history.replaceState(null,'',cur==='tutte'?location.pathname:'#'+cur)}catch(_){}
  const qi=document.getElementById('q'); if(qi){qi.addEventListener('input',()=>{const pos=qi.selectionStart;go(cur,true);const n=document.getElementById('q');n.focus();n.setSelectionRange(pos,pos)})}
  if(!keepQ)window.scrollTo({top:0});
}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-go]');if(b)go(b.dataset.go)});
document.getElementById('pick').addEventListener('change',e=>go(e.target.value));
rail(); go(decodeURIComponent((location.hash||'').slice(1)));
</script>
